steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/propertysearch_api/propertysearch-api-prod:$COMMIT_SHA'
      - '.'

  # 2. Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/propertysearch_api/propertysearch-api-prod:$COMMIT_SHA'

  # 3. Update migration job to use the NEW image
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'propertysearch-api-prod'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/propertysearch_api/propertysearch-api-prod:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'

  # 4. Run database migrations and wait for completion
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'propertysearch-api-prod'
      - '--region'
      - 'asia-south1'
      - '--wait'

  # 5. Deploy same image to Cloud Run API
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'propertysearch-api-prod'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/propertysearch_api/propertysearch-api-prod:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/propertysearch_api/propertysearch-api-prod:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY